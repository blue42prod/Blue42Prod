# STEP: change YOUR-GITHUB-USERNAME/YOUR-REPO-NAME below to your real GitHub repo (see SETUP-GUIDE.md).
backend:
  name: github
  repo: blue42prod/Blue42Prod
  branch: main
media_folder: public/uploads
public_folder: /uploads
publish_mode: simple
site_url: https://blue42prod.com
logo_url: /logo-white-bg.png

collections:
  - name: stories
    label: Stories
    folder: src/content/stories
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} ({{category}})"
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
      - {label: Category, name: category, widget: select, options: ["Game Recaps", "Player Spotlights", "Features", "News", "Culture & Lifestyle"]}
      - label: Region
        name: region
        widget: select
        options: [{label: North Louisiana, value: north}, {label: Central, value: central}, {label: Southwest, value: southwest}, {label: Acadiana, value: acadiana}, {label: Baton Rouge Area, value: baton-rouge}, {label: Northshore, value: northshore}, {label: Greater New Orleans, value: new-orleans}]
      - {label: School, name: school, widget: string, required: false}
      - {label: Short summary, name: dek, widget: text}
      - {label: Photo, name: image, widget: image, required: false}
      - {label: Photo description (alt text), name: imageAlt, widget: string, required: false}
      - {label: Creator credit, name: photographer, widget: string, required: false}
      - {label: "Permission on file for the photo (photo stays hidden unless checked)", name: imagePermission, widget: boolean, default: false}
      - {label: "Story of the week (main feature, pick one at a time)", name: featured, widget: boolean, default: false}
      - {label: "Show in the Stories of the week list", name: topPick, widget: boolean, default: false}
      - {label: Story text, name: body, widget: markdown}

  - name: creators
    label: Creators
    folder: src/content/creators
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - {label: Name, name: title, widget: string}
      - label: Regions covered
        name: regions
        widget: select
        multiple: true
        options: [{label: North Louisiana, value: north}, {label: Central, value: central}, {label: Southwest, value: southwest}, {label: Acadiana, value: acadiana}, {label: Baton Rouge Area, value: baton-rouge}, {label: Northshore, value: northshore}, {label: Greater New Orleans, value: new-orleans}]
      - {label: Specialties, name: specialties, widget: list, default: ["Game action"]}
      - {label: Rates, name: rates, widget: string, required: false}
      - {label: Business email, name: email, widget: string, required: false}
      - {label: Business phone, name: phone, widget: string, required: false}
      - {label: Website or Instagram link, name: link, widget: string, required: false}
      - {label: Short bio, name: bio, widget: text, required: false}
      - {label: Photo of the creator, name: image, widget: image, required: false}

  - name: galleries
    label: Photo galleries (one per game)
    label_singular: Game gallery
    folder: src/content/galleries
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} ({{date}})"
    fields:
      - {label: "Game (like Alexandria vs. Pineville)", name: title, widget: string}
      - {label: Game date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false}
      - {label: School, name: school, widget: string, required: false}
      - {label: "Creator (default credit for every photo in this gallery)", name: photographer, widget: string}
      - {label: "Cover photo (optional, the first photo is used if empty)", name: cover, widget: image, required: false}
      - {label: Short description, name: description, widget: text, required: false}
      - label: Photos
        name: photos
        widget: list
        summary: "{{fields.caption}}"
        fields:
          - {label: Photo, name: image, widget: image, required: false}
          - {label: Caption, name: caption, widget: string, required: false}
          - {label: Photo description (alt text), name: alt, widget: string}
          - {label: "Creator (only if different from the gallery credit)", name: photographer, widget: string, required: false}
          - {label: "Permission on file (photo stays hidden unless checked)", name: permission, widget: boolean, default: false}

  - name: polls
    label: Polls
    folder: src/content/polls
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - {label: Poll title, name: title, widget: string}
      - {label: Type, name: kind, widget: select, options: [{label: Best Jersey, value: jersey}, {label: Player of the Week, value: player}]}
      - {label: Week of, name: week, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
      - {label: Status, name: status, widget: select, options: [{label: Open for voting, value: open}, {label: Closed, value: closed}], default: open}
      - {label: "Winner (fill in when you close the poll)", name: winner, widget: string, required: false}
      - label: Options
        name: options
        widget: list
        fields:
          - {label: Name, name: label, widget: string}
          - {label: School, name: school, widget: string, required: false}
          - {label: Picture, name: image, widget: image, required: false}
          - {label: "Permission on file for a player picture (hidden unless checked)", name: permission, widget: boolean, default: false}
          - {label: "Jersey color if no picture (like #1647FF)", name: color, widget: string, required: false}
          - {label: Jersey number if no picture, name: number, widget: string, required: false}

  - name: rankings
    label: Rankings (schools and players)
    label_singular: Weekly rankings
    folder: src/content/rankings
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Week of, name: week, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
      - label: "Teams (top 42 schools in the state)"
        name: entries
        widget: list
        fields:
          - {label: Rank, name: rank, widget: number, value_type: int}
          - {label: Team, name: team, widget: string}
          - label: Region
            name: region
            widget: select
            options: [{label: North Louisiana, value: north}, {label: Central, value: central}, {label: Southwest, value: southwest}, {label: Acadiana, value: acadiana}, {label: Baton Rouge Area, value: baton-rouge}, {label: Northshore, value: northshore}, {label: Greater New Orleans, value: new-orleans}]
          - {label: LHSAA class, name: classification, widget: string, required: false}
          - {label: Record, name: record, widget: string, required: false}
          - {label: Movement, name: move, widget: select, options: [{label: Up, value: up}, {label: Down, value: down}, {label: No change, value: same}], default: same}
          - {label: "Football logo (shown for the top 5 schools)", name: logo, widget: image, required: false}
          - {label: "School color for the logo badge (like #1647FF)", name: color, widget: string, required: false}
          - {label: Short blurb, name: blurb, widget: text, required: false}
      - label: "Players (top 42 in the state; ranks 1 to 5 show as sports cards)"
        name: players
        widget: list
        required: false
        max: 42
        summary: "#{{fields.rank}} {{fields.name}} ({{fields.school}})"
        fields:
          - {label: Rank, name: rank, widget: number, value_type: int}
          - {label: Player name, name: name, widget: string}
          - {label: School, name: school, widget: string}
          - {label: "Position (like QB, RB, WR, LB)", name: position, widget: string, required: false}
          - {label: "Class (like 2027 or Jr.)", name: classYear, widget: string, required: false}
          - label: Region
            name: region
            widget: select
            options: [{label: North Louisiana, value: north}, {label: Central, value: central}, {label: Southwest, value: southwest}, {label: Acadiana, value: acadiana}, {label: Baton Rouge Area, value: baton-rouge}, {label: Northshore, value: northshore}, {label: Greater New Orleans, value: new-orleans}]
          - {label: "Height (like 6-2)", name: height, widget: string, required: false}
          - {label: "Weight in lbs (like 205)", name: weight, widget: string, required: false}
          - {label: Jersey number, name: number, widget: string, required: false}
          - {label: "School color for the card (like #1647FF)", name: color, widget: string, required: false}
          - {label: "Season stats line (like 1,385 rush yds, 17 TD)", name: stats, widget: string, required: false}
          - {label: Movement, name: move, widget: select, options: [{label: Up, value: up}, {label: Down, value: down}, {label: No change, value: same}], default: same}
          - {label: "Player photo (used on the sports card for the top 5; a tall photo works best)", name: image, widget: image, required: false}
          - {label: "Permission on file for the player photo (photo stays hidden unless checked)", name: permission, widget: boolean, default: false}
          - {label: Short blurb, name: blurb, widget: text, required: false}

  - name: schools
    label: Schools (map)
    label_singular: School
    folder: src/content/schools
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} ({{city}})"
    fields:
      - {label: School name, name: title, widget: string}
      - {label: Mascot, name: mascot, widget: string, required: false}
      - {label: City, name: city, widget: string, required: false}
      - label: Region
        name: region
        widget: select
        options: [{label: North Louisiana, value: north}, {label: Central, value: central}, {label: Southwest, value: southwest}, {label: Acadiana, value: acadiana}, {label: Baton Rouge Area, value: baton-rouge}, {label: Northshore, value: northshore}, {label: Greater New Orleans, value: new-orleans}]
      - {label: "Pin latitude (in Google Maps, right-click the school and copy the first number, like 31.3113)", name: lat, widget: number, value_type: float}
      - {label: "Pin longitude (the second number, like -92.4451)", name: lng, widget: number, value_type: float}
      - {label: LHSAA class, name: classification, widget: string, required: false}
      - {label: "School color for the pin (like #1647FF)", name: color, widget: string, required: false}
      - {label: "Football logo (shown when there is no photo)", name: logo, widget: image, required: false}
      - {label: Season record, name: record, widget: string, required: false}
      - {label: Head coach, name: coach, widget: string, required: false}
      - {label: Stadium, name: stadium, widget: string, required: false}
      - {label: Year founded, name: founded, widget: string, required: false}
      - {label: Enrollment, name: enrollment, widget: string, required: false}
      - label: "Stats (like State titles: 3)"
        name: stats
        widget: list
        required: false
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - {label: Stat name, name: label, widget: string}
          - {label: Value, name: value, widget: string}
      - {label: Fun facts, name: funFacts, widget: list, required: false}
      - label: Photos of the school or team
        name: photos
        widget: list
        required: false
        fields:
          - {label: Photo, name: image, widget: image}
          - {label: Photo description (alt text), name: alt, widget: string}
          - {label: Creator credit, name: photographer, widget: string, required: false}
          - {label: "Permission on file (photo stays hidden unless checked)", name: permission, widget: boolean, default: false}
      - {label: Short description, name: blurb, widget: text, required: false}
      - {label: School website, name: website, widget: string, required: false}

  - name: settings
    label: Site text
    files:
      - label: Home and About text
        name: site
        file: src/content/settings/site.json
        format: json
        fields:
          - {label: Home headline, name: heroHeadline, widget: string}
          - {label: Home subheading, name: heroSubhead, widget: text}
          - {label: About page text, name: aboutText, widget: text}
          - {label: "YouTube channel link (e.g. https://www.youtube.com/@yourchannel). Leave blank until the channel is live; the newest video then shows on Home and About automatically.", name: youtubeUrl, widget: string, required: false}
      - label: Homepage carousel
        name: home-carousel
        file: src/content/settings/home-carousel.json
        format: json
        fields:
          - {label: "Shuffle the photo order on every visit (the logo always shows first)", name: shuffle, widget: boolean, default: true}
          - {label: Seconds per slide, name: seconds, widget: number, value_type: int, default: 8, min: 2, max: 15}
          - label: "Photos (up to 20)"
            name: photos
            widget: list
            max: 20
            summary: "{{fields.caption}}"
            fields:
              - {label: Photo, name: image, widget: image, required: false}
              - {label: Caption, name: caption, widget: string, required: false}
              - {label: Photo description (alt text), name: alt, widget: string}
              - {label: Creator (credit shown on the photo), name: photographer, widget: string, required: false}
              - {label: "Permission on file (photo stays hidden unless checked)", name: permission, widget: boolean, default: false}
      - label: Photos of the Week
        name: photos-of-the-week
        file: src/content/settings/photos-of-the-week.json
        format: json
        fields:
          - {label: Week of, name: week, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
          - {label: Short intro, name: intro, widget: string, required: false}
          - label: "Photos (up to 5, in order)"
            name: photos
            widget: list
            max: 5
            summary: "{{fields.caption}}"
            fields:
              - {label: Photo, name: image, widget: image, required: false}
              - {label: Caption, name: caption, widget: string, required: false}
              - {label: Photo description (alt text), name: alt, widget: string}
              - {label: Creator (credit shown on the photo), name: photographer, widget: string}
              - {label: Game, name: game, widget: string, required: false}
              - {label: "Permission on file (photo stays hidden unless checked)", name: permission, widget: boolean, default: false}
  - name: shop
    label: Shop
    folder: src/content/shop
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - {label: Product name, name: title, widget: string}
      - {label: Price (like $25), name: price, widget: string}
      - {label: Photo, name: image, widget: image, required: false}
      - {label: Photo description (alt text), name: alt, widget: string, required: false}
      - {label: Sizes or details, name: details, widget: string, required: false}
      - {label: Buy link (from your payment service), name: buyLink, widget: string}
      - {label: Show in the shop, name: active, widget: boolean, default: true}
      - {label: Sort order (small numbers first), name: order, widget: number, value_type: int, default: 10}
